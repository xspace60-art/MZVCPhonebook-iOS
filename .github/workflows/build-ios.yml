name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MZVCPhonebook iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Xcode & SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build App for iOS Device
        run: |
          set -o pipefail
          xcodebuild \
            -project MZVCPhonebook.xcodeproj \
            -scheme MZVCPhonebook \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log || {
              echo "Build failed"
              exit 1
            }

      - name: Package Installable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "MZVCPhonebook.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr MZVCPhonebook.ipa Payload
          mkdir -p output
          mv MZVCPhonebook.ipa output/

      - name: Upload IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: MZVCPhonebook-iOS-IPA
          path: output/MZVCPhonebook.ipa
          if-no-files-found: error

      - name: Publish Build Log to Logs Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B logs
          cp xcodebuild.log build-error.txt || echo "No log generated" > build-error.txt
          git add build-error.txt
          git commit -m "Auto-published xcodebuild log"
          git push -f origin logs
