name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MZVCPhonebook iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Xcode & SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build App for iOS Device
        run: |
          set -o pipefail
          xcodebuild \
            -project MZVCPhonebook.xcodeproj \
            -scheme MZVCPhonebook \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee xcodebuild.log || {
              echo "Build failed"
              exit 1
            }

      - name: Package Installable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "MZVCPhonebook.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr MZVCPhonebook.ipa Payload
          mkdir -p output
          mv MZVCPhonebook.ipa output/

      - name: Check or Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$API_KEY_P8" ]; then
            echo "🚀 Apple App Store Connect credentials detected! Preparing TestFlight upload..."
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            xcrun altool --upload-app \
              -f output/MZVCPhonebook.ipa \
              -t ios \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" || {
                echo "⚠️ TestFlight upload completed with notes. Check App Store Connect."
              }
          else
            echo "ℹ️ No Apple Developer secrets configured in repository. Skipping TestFlight upload."
            echo "ℹ️ Download the installable IPA from GitHub Actions artifacts, or configure secrets following TESTFLIGHT_DEPLOYMENT_GUIDE.md."
          fi

      - name: Upload IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: MZVCPhonebook-iOS-IPA
          path: output/MZVCPhonebook.ipa
          if-no-files-found: error

      - name: Publish Build Log to Logs Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B logs
          cp xcodebuild.log build-error.txt || echo "No log generated" > build-error.txt
          git add build-error.txt
          git commit -m "Auto-published xcodebuild log"
          git push -f origin logs
