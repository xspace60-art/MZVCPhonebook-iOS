name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MZVCPhonebook iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build App for iOS Device
        run: |
          xcodebuild \
            -project MZVCPhonebook.xcodeproj \
            -scheme MZVCPhonebook \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Installable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "MZVCPhonebook.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr MZVCPhonebook.ipa Payload
          mkdir -p output
          mv MZVCPhonebook.ipa output/

      - name: Upload IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: MZVCPhonebook-iOS-IPA
          path: output/MZVCPhonebook.ipa
          if-no-files-found: error
